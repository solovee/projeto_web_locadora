{% extends 'base.html' %}
{% block title %}Cidades{% endblock %}
{% block content %}
<h2>Lista de Cidades</h2>

<button class="add">Adicionar Cidade</button>
<br><br>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Estado</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for cidade in cidades %}
        <tr>
            <td>{{ cidade.id }}</td>
            <td>{{ cidade.nome }}</td>
            <td>{{ cidade.estado }}</td>
            <td>
                <button class="edit">Editar</button>
                <button class="delete">Excluir</button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
