{% extends 'base.html' %}
{% block title %}Gêneros{% endblock %}
{% block content %}
<h2>Lista de Gêneros</h2>

<button class="add">Adicionar Gênero</button>
<br><br>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Descrição</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for genero in generos %}
        <tr>
            <td>{{ genero.id }}</td>
            <td>{{ genero.descricao }}</td>
            <td>
                <button class="edit">Editar</button>
                <button class="delete">Excluir</button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
